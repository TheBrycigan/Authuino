sentence=ISO 7816-3 T=0/T=1 smart-card driver for ESP32-S3 with the NCN8024 interface IC.
paragraph=Bit-banged half-duplex ISO 7816-3 driver. LEDC clock generation, ATR parsing with edge-based ETU auto-detection, the full T=0 procedure-byte protocol, and the T=1 block protocol (IFSD negotiation, WTX handling, LRC/CRC). Hardware-agnostic above the pin layer, so any ESP32 board wired to an NCN8024 (or compatible) card interface works. Originally written for the Authuino offline-2FA project, extracted as a reusable dependency.
