sentence=QR-code decoding library (quirc), wrapped as an Arduino library.
paragraph=Thin Arduino wrapper around dlbeer/quirc, pinned as a git submodule under upstream/. The src/ shims compile quirc's lib/ sources (quirc.c, decode.c, identify.c, version_db.c) as separate translation units and expose quirc.h on the library include path. Used by Authuino's camera QR scanner.
